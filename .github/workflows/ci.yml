name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install schema checker
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Format conformance examples
        run: python spec/validate_examples.py --require-jsonschema
      - name: Audit release packages
        run: python scripts/build_release.py --out "${{ runner.temp }}/remvu-release"
      - name: Fresh archive lifecycle smoke
        run: python scripts/package_smoke.py "${{ runner.temp }}/remvu-release"
      - name: Validate beta acceptance ledger
        run: python scripts/check_beta_readiness.py
      - name: Retain candidate packages for native testing
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: remvu-candidate-packages
          path: ${{ runner.temp }}/remvu-release/*
          if-no-files-found: error
