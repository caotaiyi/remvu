name: Experimental unsupported Windows Python 3.9 recorder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Reproduce unsupported recorder pressure without relaxing assertions
        run: python scripts/stress_hooks.py --iterations 10
